<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Payment Problem</title></head>
<body style="font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px;">
  <div style="max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px;">
    <h2 style="color: #c62828;">There was a problem with your payment</h2>
    <p>We are sorry, but a problem occurred while processing the payment for your order.</p>
    <table style="width:100%; border-collapse: collapse; margin-top: 20px;">
      <tr>
        <td style="padding: 8px; font-weight: bold;">Order number:</td>
        <td style="padding: 8px;" th:text="${orderId}">ORDER-ID</td>
      </tr>
      <tr>
        <td style="padding: 8px; font-weight: bold;">Reason:</td>
        <td style="padding: 8px;" th:text="${reason}">reason</td>
      </tr>
    </table>
    <p style="margin-top: 20px; color: #666;">Please contact support if you need assistance.</p>
    <p style="color: #999; font-size: 12px; margin-top: 30px;">SmxECommerce — noreply@smxecommerce.local</p>
  </div>
</body>
</html>
