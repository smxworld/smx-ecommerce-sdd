<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Order Shipped</title></head>
<body style="font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px;">
  <div style="max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px;">
    <h2 style="color: #1565c0;">Your order is on its way!</h2>
    <p>Good news! Your order has been shipped and is on its way to you.</p>
    <table style="width:100%; border-collapse: collapse; margin-top: 20px;">
      <tr>
        <td style="padding: 8px; font-weight: bold;">Order number:</td>
        <td style="padding: 8px;" th:text="${orderId}">ORDER-ID</td>
      </tr>
      <tr>
        <td style="padding: 8px; font-weight: bold;">Tracking:</td>
        <td style="padding: 8px; font-weight: bold; color: #1565c0;" th:text="${trackingNumber}">TRK-XXXXXXXX</td>
      </tr>
    </table>
    <p style="margin-top: 20px; color: #666;">You can follow the shipment from your account in the orders area.</p>
    <p style="color: #999; font-size: 12px; margin-top: 30px;">SmxECommerce — noreply@smxecommerce.local</p>
  </div>
</body>
</html>
