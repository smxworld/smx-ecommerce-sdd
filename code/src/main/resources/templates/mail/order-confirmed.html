<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Order Confirmed</title></head>
<body style="font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px;">
  <div style="max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px;">
    <h2 style="color: #2e7d32;">Your order is confirmed!</h2>
    <p>Thank you for your purchase. Your order has been confirmed and will be processed shortly.</p>
    <table style="width:100%; border-collapse: collapse; margin-top: 20px;">
      <tr>
        <td style="padding: 8px; font-weight: bold;">Order number:</td>
        <td style="padding: 8px;" th:text="${orderId}">ORDER-ID</td>
      </tr>
      <tr>
        <td style="padding: 8px; font-weight: bold;">Total:</td>
        <td style="padding: 8px;" th:text="'€ ' + ${#numbers.formatDecimal(totalAmount, 1, 2)}">€ 0.00</td>
      </tr>
    </table>
    <p style="margin-top: 20px; color: #666;">You will receive another email when your order has been shipped.</p>
    <p style="color: #999; font-size: 12px; margin-top: 30px;">SmxECommerce — noreply@smxecommerce.local</p>
  </div>
</body>
</html>
