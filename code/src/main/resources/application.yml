spring:
  application:
    name: smx-ecommerce

  # ─── Primary datasource ───────────────────────────────────────────────────
  # Ogni modulo configura il proprio DataSource bean (via @ConfigurationProperties)
  # che punta allo stesso cluster PostgreSQL con schema dedicato (search_path).
  datasource:
    url: jdbc:postgresql://localhost:5432/smx_ecommerce
    username: smx
    password: smx
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  # Flyway è disabilitato globalmente: ogni modulo gestisce le proprie migration
  # tramite un FlywayConfigurationCustomizer dedicato in internal/infrastructure.
  # Script: src/main/resources/db/migration/<schema>/V1__init.sql
  flyway:
    enabled: false

  # ─── Elasticsearch ────────────────────────────────────────────────────────
  elasticsearch:
    uris: http://localhost:9200

  # ─── Mail (Mailpit in development) ────────────────────────────────────────
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  # ─── Security / OAuth2 Resource Server ───────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/smxworld

# ─── Per-module datasource configuration ─────────────────────────────────────
# Ogni modulo legge la propria sezione tramite @ConfigurationProperties.
# La URL usa il parametro currentSchema di PostgreSQL JDBC per l'isolamento.
smx:
  modules:
    catalog:
      datasource:
        url: jdbc:postgresql://localhost:5432/smx_ecommerce?currentSchema=smx_catalog
        username: smx
        password: smx
    cart:
      datasource:
        url: jdbc:postgresql://localhost:5432/smx_ecommerce?currentSchema=smx_cart
        username: smx
        password: smx
    order:
      datasource:
        url: jdbc:postgresql://localhost:5432/smx_ecommerce?currentSchema=smx_order
        username: smx
        password: smx
    payment:
      datasource:
        url: jdbc:postgresql://localhost:5432/smx_ecommerce?currentSchema=smx_payment
        username: smx
        password: smx
    warehouse:
      datasource:
        url: jdbc:postgresql://localhost:5432/smx_ecommerce?currentSchema=smx_warehouse
        username: smx
        password: smx
    shipment:
      datasource:
        url: jdbc:postgresql://localhost:5432/smx_ecommerce?currentSchema=smx_shipment
        username: smx
        password: smx
    review:
      datasource:
        url: jdbc:postgresql://localhost:5432/smx_ecommerce?currentSchema=smx_review
        username: smx
        password: smx
    analytics:
      datasource:
        url: jdbc:postgresql://localhost:5432/smx_ecommerce?currentSchema=smx_analytics
        username: smx
        password: smx

# ─── Spring Modulith ──────────────────────────────────────────────────────────
spring.modulith:
  events:
    jdbc:
      schema-initialization:
        enabled: true
