# Configurazione per i test: sostituisce PostgreSQL + ES con H2 in-memory.
# Flyway non gira (smx.modules.catalog.datasource.url vuoto → @ConditionalOnProperty false).
# ddl-auto=create-drop: Hibernate crea le tabelle da zero in H2.
spring:
  datasource:
    url: jdbc:h2:mem:smx-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  # Elasticsearch auto-configuration esclusa: in test i bean ES vengono forniti
  # da @TestConfiguration come mock Mockito (proxy JDK, senza byte-buddy).
  # @MockBean(RETURNS_DEEP_STUBS) fallisce su Java 25 perché byte-buddy non riesce
  # a strumentare tutta la gerarchia di tipi di ElasticsearchOperations.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration

smx:
  modules:
    catalog:
      datasource:
        # "false" disabilita @ConditionalOnProperty("smx.modules.catalog.datasource.url")
        # perché Spring Boot considera la stringa "false" come condizione non soddisfatta.
        # Con ddl-auto=create-drop Hibernate crea direttamente le tabelle da JPA, senza Flyway.
        url: "false"
