<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head><meta charset="UTF-8"><title>Ordine Confermato</title></head>
<body style="font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px;">
  <div style="max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px;">
    <h2 style="color: #2e7d32;">Il tuo ordine è confermato!</h2>
    <p>Grazie per il tuo acquisto. Il tuo ordine è stato confermato e sarà processato a breve.</p>
    <table style="width:100%; border-collapse: collapse; margin-top: 20px;">
      <tr>
        <td style="padding: 8px; font-weight: bold;">Numero ordine:</td>
        <td style="padding: 8px;" th:text="${orderId}">ORDER-ID</td>
      </tr>
      <tr>
        <td style="padding: 8px; font-weight: bold;">Totale:</td>
        <td style="padding: 8px;" th:text="'€ ' + ${#numbers.formatDecimal(totalAmount, 1, 2)}">€ 0.00</td>
      </tr>
    </table>
    <p style="margin-top: 20px; color: #666;">Riceverai un'email di aggiornamento quando il tuo ordine verrà spedito.</p>
    <p style="color: #999; font-size: 12px; margin-top: 30px;">SmxECommerce — noreply@smxecommerce.local</p>
  </div>
</body>
</html>
